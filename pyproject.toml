[project]
name = "stale-cube"
version = "0.1.0"
description = "Experiment: how Icechunk virtual refs behave when source COGs change"
requires-python = ">=3.12,<3.14"
dependencies = [
    "icechunk>=2.3,<3",
    "virtualizarr>=2.8,<3",
    "virtual-tiff>=0.5",
    "obstore>=0.12",
    "zarr>=3.4",
    "xarray>=2025.1",
    "dask>=2025.1",
    # rasterio 1.5.2 publishes only macOS 15+ arm64 wheels; older macOS falls back to a
    # source build against whatever system GDAL is present.
    "rasterio>=1.4,<1.5.2",
    "boto3>=1.35",
    "numpy>=2",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "jupyterlab>=4.3",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stale_cube"]

[tool.uv]
no-build-package = ["rasterio"]
